      <details><summary>Миний код ажиллахгүй, эсвэл хариу зөрвөл яах вэ?</summary>

        <p>«Аяллын зураг»-т нээлттэй даалгавраа сонго. Сорил таарахад Python командаар баатраа хөдөлгөнө. «Тулаан»-д дайсны дараагийн үйлдлийг харж, кодоор хариу үйлдлээ сонгоно.</p>
        <p>Өөрийн санааг шууд туршихад «Чөлөөт талбар» тохирно. Жишээ нь <code>print(2 + 3)</code> гэж бичээд хариуг нь хар. Энд өөрөө туршилтаа сонгодог.</p>
